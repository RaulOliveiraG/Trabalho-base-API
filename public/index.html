<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>Gestão de Tarefas</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-5">
    <h1 class="mb-4">Gestão de Tarefas</h1>

    <!--login-->
    <div id="login-card" class="card mb-3">
      <div class="card-body">
        <h5 class="card-title">Login</h5>
        <form id="loginForm">
            <input class="form-control mb-2" placeholder="Email" type="email" name="email" required>
            <input class="form-control mb-2" placeholder="Senha" type="password" name="password" required>
            <button class="btn btn-primary" type="submit">Entrar</button>
        </form>
        <div class="mt-2">Ou <a href="#" id="showRegister">registre-se</a></div>
        <div id="login-msg" class="text-danger mt-2"></div>
      </div>
    </div>
    
    <!--registrar-->
    <div id="register-card" class="card mb-3" style="display:none;">
      <div class="card-body">
        <h5 class="card-title">Cadastro</h5>
        <form id="registerForm">
          <input class="form-control mb-2" placeholder="Nome" type="text" name="name" required>
          <input class="form-control mb-2" placeholder="Email" type="email" name="email" required>
          <input class="form-control mb-2" placeholder="Senha" type="password" name="password" required>
          <button class="btn btn-primary" type="submit">Registrar</button>
        </form>
        <div class="mt-2">Já tem conta? <a href="#" id="showLogin">Entrar</a></div>
        <div id="register-msg" class="text-danger mt-2"></div>
      </div>
    </div>

    <div id="tasks-section" style="display:none;">
      <div class="d-flex justify-content-between align-items-center">
        <h2>Minhas Tarefas</h2>
        <button id="logout" class="btn btn-danger btn-sm">Sair</button>
      </div>
      <form id="taskForm" class="mb-3">
        <input class="form-control mb-2" placeholder="Título" name="title" required>
        <input class="form-control mb-2" placeholder="Descrição" name="description">
        <button class="btn btn-success" type="submit">Criar Tarefa</button>
        <button class="btn btn-secondary" type="button" id="cancelEdit" style="display:none;">Cancelar Edição</button>
      </form>
      <table class="table">
        <thead>
          <tr>
            <th>Título</th>
            <th>Descrição</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="taskList"></tbody>
      </table>
    </div>
  </div>
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>






<script>
  const API = '/api';  //URL base da API
  let userId = localStorage.getItem('userId');// Recupera o userId salvo no navegador
  let editingTaskId = null;// ID da tarefa que está sendo editada
  
  function limparForm() {  //limpa o formulário de tarefa
    $('#taskForm')[0].reset(); // Reseta os campos do formulário
    editingTaskId = null; // Limpa o ID de edição
    $('#taskForm button[type=submit]').text('Criar Tarefa'); // Altera texto do botão
    $('#cancelEdit').hide(); // Esconde botão de cancelar
  }
  
  //limpar a lista de tarefas
  function limparTasks() { 
    $('#taskList').html(''); 
  }
  
  // Mostra tela de login
  function showLogin() { 
    $('#tasks-section').hide();
    $('#register-card').hide();
    $('#login-card').show();
    limparTasks();
    limparForm();
  }
  
  // Mostra tela de registro
  function showRegister() { 
    $('#tasks-section').hide();
    $('#login-card').hide();
    $('#register-card').show();
    limparTasks();
    limparForm();
  }
  
  // Mostra tela de tarefas
  function showTasks() { 
    $('#login-card, #register-card').hide();
    $('#tasks-section').show();
    limparForm();
  }
  
  // clique para mudar entre login e registro
  $('#showRegister').on('click', showRegister);
  $('#showLogin').on('click', showLogin);
  
  $('#registerForm').on('submit', async function(e){
    e.preventDefault(); // Impede comportamento padrão de enviar o formulário
    let data = Object.fromEntries(new FormData(this)); // Pega dados do formulário
  
    // requisição para registrar novo usuário
    let res = await fetch(API + '/users/register', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    });
  
    if (res.ok) { 
      $('#register-msg').text('Cadastro realizado! Faça login.');
    } else { 
      let ret = await res.json();
      $('#register-msg').text(ret.error || ret.message);
    }
  });
  
  //LOGIN
  $('#loginForm').on('submit', async function(e){
    e.preventDefault();
    let data = Object.fromEntries(new FormData(this)); // Pega dados do formulário
  
    //requisição para login
    let res = await fetch(API + '/users/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    });
  
    if (res.ok) { 
      let ret = await res.json();
      localStorage.setItem('userId', ret.user.id); //Salva userId localmente
      userId = ret.user.id;
      showTasks(); // Mostra tarefas
      loadTasks(); // Carrega tarefas
    } else { 
      let ret = await res.json();
      $('#login-msg').text(ret.error || ret.message);
    }
  });
  
  //CRIAR/EDITAR TAREFA
  $('#taskForm').on('submit', async function(e){
    e.preventDefault();
    if (!userId) { showLogin(); return; } // Se não logado, vai para login
    
    let data = Object.fromEntries(new FormData(this)); // Pega dados da tarefa
    let method = editingTaskId ? 'PUT' : 'POST'; // PUT editar, POST criar
    let url = editingTaskId ? `${API}/tasks/${editingTaskId}` : `${API}/tasks`; // URL dinâmica
  
    //requisição para criar ou atualizar tarefa
    let res = await fetch(url, {
      method,
      headers:{
        'Content-Type':'application/json',
        'x-user-id': userId
      },
      body:JSON.stringify(data)
    });
  
    if (res.ok) {//pós sucesso
      limparForm(); // Limpa o formulário 
      loadTasks();  // Recarrega tarefas
    }
  });
  
  //cancelar edição de tarefa
  $('#cancelEdit').on('click',function(){ 
    limparForm(); 
  });
  
  //CARREGAR TAREFAS
  async function loadTasks() {
    if (!userId) { showLogin(); return; } // Se não logado vai pro login
  
    // Busca tarefas do usuário
    let res = await fetch(`${API}/tasks`, {
      headers: { 'x-user-id': userId }
    });
  
    if (res.status === 401) { showLogin(); return; } // Se não autorizado, volta login
    let tasks = await res.json(); // Pega lista de tarefas
  
    // Monta HTML da lista de tarefas
    let html = tasks.map(task => `
      <tr>
        <td>${task.title}</td>
        <td>${task.description || ''}</td>
        <td>${task.done ? 'Concluída' : 'Pendente'}</td>
        <td>
          <button onclick="editTask('${task._id}')" class="btn btn-warning btn-sm">Editar</button>
          <button onclick="toggleDone('${task._id}',${!task.done})" class="btn btn-${task.done ? 'secondary':'success'} btn-sm">
            ${task.done ? 'Refazer':'Concluir'}
          </button>
          <button onclick="deleteTask('${task._id}')" class="btn btn-danger btn-sm">Deletar</button>
        </td>
      </tr>
    `).join('');
  
    // Exibe a lista montada no HTML
    $('#taskList').html(html);
  }
  
  //ALTERAR STATUS (Concluir/Refazer)
  window.toggleDone = async function(id, val){
    if (!userId) return;
  
    // Atualiza o campo 'done' da tarefa
    await fetch(`${API}/tasks/${id}`, {
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        'x-user-id': userId
      },
      body:JSON.stringify({done:val})
    });
  
    loadTasks(); // Recarrega tarefas depois de alterar
  }
  
  // DELETAR TAREFA
  window.deleteTask = async function(id){
    if (!userId) return;
  
    // Apaga a tarefa
    await fetch(`${API}/tasks/${id}`, {
      method:'DELETE',
      headers:{ 'x-user-id': userId }
    });
  
    loadTasks(); // Recarrega depois de deletar
  }
  
  //EDITAR TAREFA
  window.editTask = async function(id) {
    if (!userId) return;
  
    // Busca tarefa para editar
    let res = await fetch(`${API}/tasks/${id}`, {
      headers: { 'x-user-id': userId }
    });
  
    let task = await res.json(); // Pega os dados dessa tarefa
  
    // Preenche com dados da tarefa
    $('input[name=title]').val(task.title);
    $('input[name=description]').val(task.description);
    editingTaskId = id; // Define ID da tarefa sendo editada
  
    // Altera botão para "Salvar Edição" e mostra botão cancelar
    $('#taskForm button[type=submit]').text('Salvar Edição');
    $('#cancelEdit').show();
  }
  
  // LOGOUT
  $('#logout').on('click',function(){
    localStorage.removeItem('userId'); // Remove ID salvo
    userId = null;
    limparTasks(); // Limpa tarefas
    limparForm(); // Limpa formulário
    showLogin(); // Volta tela para login
  });
  
  // INICIALIZAÇÃO AUTOMÁTICA: se usuário estiver logado carrega...
  if (userId) { 
    showTasks();
    loadTasks();
  } else {
    showLogin();
  }
  </script>
  
</body>
</html>
